image: nikolaik/python-nodejs

pipelines:
  custom:
    # Run tests
    test:
      - step: &test
          name: Test
          script:
            - npm install
            - npm test

    # Build & deploy app to staging environment
    deploy_staging:
      - step: &deploy_staging
          name: Deploy to Staging
          deployment: staging
          caches:
            - node
          script: # Modify the commands below to build your repository.
            - npm install
            - npm run build
            - pwd
            - ls
            - pip install awscli --upgrade --ignore-installed six
            - aws s3 sync ./build s3://dev-chatloop-admin
            - pwd
            - ls
            - aws s3 cp --cache-control max-age=0 ./build/service-worker.js s3://dev-chatloop-admin/
            - aws cloudfront create-invalidation --distribution-id EB299TW0BQQ5S --paths '/*'

    # Build & deploy app to production environment, manually via pipeline web interface
    deploy_production:
      - step: &deploy_production
          name: Deploy to Production
          trigger: manual
          deployment: production
          caches:
            - node
          script:
            - npm install
            - npm run build
            - pip install awscli --upgrade --ignore-installed six
            - aws s3 sync ./build s3://chatloop-admin
            - aws s3 cp --cache-control max-age=0 ./build/service-worker.js s3://chatloop-admin/
            - aws cloudfront create-invalidation --distribution-id E18X4CR0C9FLXD --paths '/*'

  # Runs tests on commits to all branches ( excpet master and dev)
  default:
    - step: *test

  branches:
    # All commits to master can be manually deployed to production environment via pipeline web interface
    master:
      - step: *test
      - step: *deploy_production

    # All commits to dev branch get automatically deployed to staging environment
    staging:
      - step: *test
      - step: *deploy_staging
