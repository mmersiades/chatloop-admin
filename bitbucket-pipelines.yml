image: nikolaik/python-nodejs

pipelines:
  custom:
    install:
      - step: &install
          name: Install
          caches:
            - npm
          script:
            - npm ci
    # Run tests
    test:
      - step: &test
          name: E2E tests
          caches:
            - npm
            - cypress
          image: cypress/base:10
          script:
            - npm ci
            - export CYPRESS_API_HOST=https://staging-api.chatloop.org
            - export CYPRESS_E2E_USERNAME=$CYPRESS_E2E_USERNAME
            - export CYPRESS_E2E_PASSWORD=$CYPRESS_E2E_PASSWORD
            - npm run start:staging & npx wait-on http://localhost:3000
            - npm run test-coverage
          artifacts:
            - coverage-combined/lcov-report/

    # Build & deploy app to staging environment
    deploy_staging:
      - step: &deploy_staging
          name: Deploy to Staging
          deployment: staging
          caches:
            - node
          script: # Modify the commands below to build your repository.
            - npm ci
            - npm run build:staging
            - pip install awscli --upgrade --ignore-installed six
            - aws s3 sync ./build s3://dev-chatloop-admin
            - aws cloudfront create-invalidation --distribution-id EB299TW0BQQ5S --paths '/*'

    # Build & deploy app to production environment, manually via pipeline web interface
    deploy_production:
      - step: &deploy_production
          name: Deploy to Production
          trigger: manual
          deployment: production
          caches:
            - node
          script:
            - npm ci
            - npm run build:prod
            - pip install awscli --upgrade --ignore-installed six
            - aws s3 sync ./build s3://chatloop-admin
            - aws cloudfront create-invalidation --distribution-id E18X4CR0C9FLXD --paths '/*'

  # Runs tests on commits to all branches (except master)
  default:
    - step: *install
    - step: *test

  branches:
    # On all commits to master...
    master:
      - step: *install
      - step: *test # ...run all the tests
      - step: *deploy_staging # ...build and automatically deploy staging
      - step: *deploy_production # ...build production and then manually deploy via Bitbucket web console

definitions:
  caches:
    npm: $HOME/.npm
    cypress: $HOME/.cache/Cypress
