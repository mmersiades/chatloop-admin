# This is a sample build configuration for JavaScript.
# Check our guides at https://confluence.atlassian.com/x/14UWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: nikolaik/python-nodejs

# pipelines:
#   default:
#     - step:
#         caches:
#           - node
#         script: # Modify the commands below to build your repository.
#           - npm install
#           - npm test

pipelines:
  custom:
    # Run tests
    test:
      - step: &test
          name: Test
          script:
            - npm install
            - npm test
    # Build & deploy app to staging environment
    deploy_staging:
      - step: &deploy_staging
          name: Deploy to Staging
          deployment: staging
          caches:
            - node
          script: # Modify the commands below to build your repository.
            - npm install
            - npm run build
            - pip install awscli --upgrade --ignore-installed six
            - aws s3 sync ./build s3://dev-chatloop-admin
            - aws s3 cp --cache-control max-age=0 ./build/service-worker.js s3://dev-chatloop-admin/
    # Build & deploy app to production environment
    deploy_production:
      - step: &deploy_production
          name: Deploy to Production
          trigger: manual
          deployment: production
          caches:
            - node
          script: # Modify the commands below to build your repository.
            - npm install
            - npm run build
            - pip install awscli --upgrade --ignore-installed six
            - aws s3 sync ./build s3://chatloop-admin
            - aws s3 cp --cache-control max-age=0 ./build/service-worker.js s3://chatloop-admin/
  # branches:
  #   dev:
  #     - step:
  #         deployment: staging
  #         caches:
  #           - node
  #         script: # Modify the commands below to build your repository.
  #           - npm install
  #           - npm run build
  #           - pip install awscli --upgrade --ignore-installed six
  #           - aws s3 sync ./build s3://dev-chatloop-admin
  #           - aws s3 cp --cache-control max-age=0 ./build/service-worker.js s3://dev-chatloop-admin/
  #   master:
  #     - step:
  #         deployment: production
  #         caches:
  #           - node
  #         script: # Modify the commands below to build your repository.
  #           - npm install
  #           - npm run build
  #           - pip install awscli --upgrade --ignore-installed six
  #           - aws s3 sync ./build s3://chatloop-admin
  #           - aws s3 cp --cache-control max-age=0 ./build/service-worker.js s3://chatloop-admin/

  default:
    - step: *test

  branches:
    # All commits to master can be manually deployed to production environment via pipeline web interface
    master:
      - step: *test
      - step: *deploy_production
    # All commits to dev branch get automatically deployed to staging environment
    dev:
      - step: *test
      - step: *deploy_staging
